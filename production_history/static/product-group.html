<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom U · Product options</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#202633;font:16px system-ui}main{max-width:1100px;margin:auto;padding:30px 22px}h1,a{color:#b72030}.bar,.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.card{background:white;padding:26px;border-radius:12px;margin:22px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}label{display:block;margin:12px 0}input,select,button{font:inherit;border:1px solid #bcc4cf;padding:11px;border-radius:7px;background:white}label>select,label>input:not([type=checkbox]){display:block;width:100%;margin-top:7px}button{cursor:pointer}.primary{background:#b72030;color:white}button:disabled{opacity:.5;cursor:default}fieldset{border:0;padding:0;margin:0}.muted,small{color:#606b7c}.summary{font-size:22px;font-weight:650}#status[data-error=true]{color:#a01429}[hidden]{display:none!important}@media(max-width:650px){.grid{grid-template-columns:1fr}}
</style></head><body><main><h1 id="heading">Product options</h1><p id="status" role="status">Checking access…</p><section id="workspace" hidden><header class="bar"><p id="identity"></p><button id="logout">Sign out</button></header><div class="bar"><a id="back" href="/products">← Back to products</a><button id="refresh">Refresh saved options</button></div><section class="card"><h2>Choose an option</h2><p id="intro"></p><div id="selectors" class="grid"></div><p id="availability" class="muted"></p></section><form id="option-form" class="card" hidden><h2 id="option-name"></h2><p id="description"></p><fieldset id="fields"><div class="grid"><label>Whole-run price (BSD, before VAT)<input id="price" type="number" min="0.01" max="1000000" step="0.01" required></label><label>VAT rate (%)<input id="vat" type="number" min="0" max="100" step="0.01" required></label></div><label><input id="active" type="checkbox"> Active — available in quotes and invoices</label></fieldset><p id="total" class="summary"></p><p id="revision" class="muted"></p><div class="actions"><button id="save" class="primary" type="submit">Save option price</button><a id="details">Other product details and images</a></div><p class="muted">The price is for one complete run. The copy count appears in the quote or invoice description.</p></form></section><script src="/product-group.js?v=117"></script></main></body></html>
