<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Custom U · My account</title><style>#account{max-width:650px}#change label{display:block;margin:18px 0;font-weight:600}#change input{display:block;width:100%;padding:12px;margin-top:6px;border:1px solid #cdd3dd;border-radius:8px}#change button{padding:12px 18px;background:#b72030;color:white;border:0;border-radius:8px;cursor:pointer}#change button:disabled{opacity:.6}#status{max-width:750px}#logout{padding:8px 14px}</style></head><body><main><header><h1>My account</h1><a href="/">Dashboard</a></header><p id="status" role="status" aria-live="polite">Checking your account…</p><section id="account" hidden><p id="identity"></p><form id="change" class="cu-panel"><h2>Change password</h2><p>Use at least 12 characters. After saving, sign in again with your new password.</p><label>Current password<input id="current" type="password" autocomplete="current-password" required maxlength="128"></label><label>New password<input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><label>Confirm new password<input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><button type="submit">Save new password</button></form><p><a href="/password">Forgot your current password?</a></p><button id="logout" type="button">Sign out</button></section><p id="return" hidden><a href="/">Return to sign in</a></p></main><script src="/account.js"></script></body></html>
